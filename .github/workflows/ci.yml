name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.python }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: narcotrace
          POSTGRES_USER: narcotrace
          POSTGRES_PASSWORD: narcotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narcotrace -d narcotrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://narcotrace:narcotrace@localhost:5432/narcotrace' || 'sqlite:///./ci-test.db' }}
      POSTGRES_TEST_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://narcotrace:narcotrace@localhost:5432/narcotrace' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: narcotrace-backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: narcotrace-backend
      - run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85 tests
        working-directory: narcotrace-backend
      - run: python -m app.export_openapi --check
        working-directory: narcotrace-backend

  ml:
    name: ML policy and runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: narcotrace-backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: narcotrace-backend
      - run: python -m pytest -q tests/test_policy.py
        working-directory: narcotrace-backend
      - run: python -c "from app.ml.classifier import model_info; info = model_info(); assert info['status'].startswith('SYNTHETIC BASELINE'); print(info['status'])"
        working-directory: narcotrace-backend

  frontend:
    name: frontend quality and generated contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narcotrace-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: narcotrace-frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:locales
      - run: npm run build
      - run: python ../scripts/check_custody_vectors.py
      - run: npm audit --audit-level=high

  e2e:
    name: compose-backed Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: narcotrace-frontend/package-lock.json
      - run: npm ci
        working-directory: narcotrace-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: narcotrace-frontend
      - run: docker compose up -d --build postgres backend
      - name: Wait for backend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - run: docker compose exec -T -e E2E_SEED_ALLOW_RESET=1 backend python -m app.seed_e2e --reset
      - run: npm run test:e2e
        working-directory: narcotrace-frontend
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: narcotrace-frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: narcotrace-frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose down

  security:
    name: dependency, image and secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
        working-directory: narcotrace-backend
      - run: npm ci
        working-directory: narcotrace-frontend
      - run: npm audit --audit-level=high
        working-directory: narcotrace-frontend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          token-setup-trivy: ${{ github.token }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
