services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: narcotrace
      POSTGRES_USER: narcotrace
      POSTGRES_PASSWORD: narcotrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narcotrace -d narcotrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./narcotrace-backend
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://narcotrace:narcotrace@postgres:5432/narcotrace
      POSTGRES_TEST_URL: postgresql+psycopg://narcotrace:narcotrace@postgres:5432/narcotrace
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./narcotrace-backend:/app
      - ./docs:/docs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./narcotrace-frontend
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./narcotrace-frontend:/app
      - frontend_node_modules:/app/node_modules

  trainer:
    profiles: ["training"]
    build:
      context: ./narcotrace-backend
      dockerfile: Dockerfile.train
    working_dir: /app
    volumes:
      - ./narcotrace-backend:/app
      - ./narcotrace-synthetic-dataset:/dataset:ro
      - ./narcotrace-backend/.cache:/cache
      - ./narcotrace-backend/training-output:/output

volumes:
  postgres_data:
  frontend_node_modules:
